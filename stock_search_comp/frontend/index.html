<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0 2px 8px;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: transparent;
    }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin: 0 0 0.35rem 0;
      color: inherit;
    }
    .input-row {
      display: flex;
      gap: 0.4rem;
      align-items: stretch;
    }
    #q {
      flex: 1;
      min-width: 0;
      padding: 0.7rem 0.75rem;
      font-size: 16px;
      border: 1px solid #c9c9c9;
      border-radius: 0.4rem;
      outline: none;
      background: #fff;
      color: #111;
    }
    #q:focus { border-color: #ff4b4b; box-shadow: 0 0 0 1px #ff4b4b; }
    #mic {
      flex: 0 0 auto;
      width: 2.75rem;
      border: 1px solid #c9c9c9;
      border-radius: 0.4rem;
      background: #fff;
      color: #333;
      font-size: 1.15rem;
      cursor: pointer;
      line-height: 1;
    }
    #mic:active { background: #f3f3f3; }
    #mic.listening {
      border-color: #ff4b4b;
      background: #ffe8e8;
      color: #c62828;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }
    #voice-status {
      margin: 0.25rem 0 0;
      font-size: 0.75rem;
      color: #666;
      min-height: 1rem;
    }
    #results-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin: 0.5rem 0 0.3rem;
    }
    #results {
      border: 1px solid #d0d0d0;
      border-radius: 0.4rem;
      /* 안내 문구를 아래로 밀고 목록을 크게 */
      max-height: min(55vh, 360px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: #fff;
      min-height: 1.8rem;
    }
    .item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.42rem 0.6rem;
      line-height: 1.35;
      border: 0;
      border-bottom: 1px solid #eee;
      background: #fff;
      color: #111;
      font-size: 0.84rem;
      cursor: pointer;
    }
    @media (max-width: 768px) {
      #results-title { margin: 0.35rem 0 0.2rem; }
      #results { max-height: min(52vh, 340px); }
      .item { padding: 0.4rem 0.55rem; font-size: 0.82rem; line-height: 1.35; }
      #picked { margin-top: 0.55rem; padding-bottom: 0.35rem; }
    }
    .item:last-child { border-bottom: 0; }
    .item:active, .item.selected { background: #ffe8e8; }
    .empty {
      padding: 0.45rem 0.55rem;
      font-size: 0.8rem;
      opacity: 0.7;
      min-height: 1.6rem;
    }
    #picked {
      margin-top: 0.65rem;
      font-size: 0.8rem;
      color: #0a7a3e;
      min-height: 1rem;
    }
  </style>
</head>
<body>
  <label for="q">이름 또는 코드</label>
  <div class="input-row">
    <input
      id="q"
      type="text"
      inputmode="search"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      data-form-type="other"
      name="stock-query-field"
      placeholder="예 : 삼성전자 또는 005930"
    />
    <button id="mic" type="button" title="음성으로 입력" aria-label="음성으로 입력">🎤</button>
  </div>
  <div id="voice-status"></div>
  <div id="results-title">검색 결과</div>
  <div id="results" aria-live="polite"></div>
  <div id="picked"></div>

  <script>
    /* Streamlit 커스텀 컴포넌트 통신 (postMessage) */
    function sendMessage(type, data) {
      const msg = Object.assign({ isStreamlitMessage: true, type: type }, data || {});
      window.parent.postMessage(msg, "*");
    }
    function setReady() {
      sendMessage("streamlit:componentReady", { apiVersion: 1 });
    }
    function setFrameHeight(height) {
      sendMessage("streamlit:setFrameHeight", { height: height });
    }
    function setComponentValue(value) {
      sendMessage("streamlit:setComponentValue", { value: value });
    }

    const qInput = document.getElementById("q");
    const resultsEl = document.getElementById("results");
    const pickedEl = document.getElementById("picked");

    let catalog = [];
    let selected = null;
    let lastSent = "";

    function norm(s) {
      return (s || "").toString().trim().toLowerCase().replace(/\s+/g, "");
    }

    function startsWithHit(item, query) {
      const nq = norm(query);
      if (!nq) return false;
      if (norm(item.name).startsWith(nq)) return true;
      if (norm(item.ticker).startsWith(nq)) return true;
      return (item.aliases || []).some(function (a) {
        return norm(a).startsWith(nq);
      });
    }

    function popularRank(ticker) {
      const order = {
        "005930.KS": 0,
        "000660.KS": 1,
        AAPL: 2,
        TSLA: 3,
        NVDA: 4,
        MSFT: 5,
        GOOGL: 6,
        "035720.KS": 7,
        "035420.KS": 8,
      };
      return Object.prototype.hasOwnProperty.call(order, ticker) ? order[ticker] : 100;
    }

    function filter(query) {
      const nq = norm(query);
      if (!nq) return [];
      return catalog
        .filter(function (item) {
          return startsWithHit(item, nq);
        })
        .sort(function (a, b) {
          const ra = popularRank(a.ticker);
          const rb = popularRank(b.ticker);
          if (ra !== rb) return ra - rb;
          return a.name.localeCompare(b.name, "ko");
        })
        .slice(0, 50);
    }

    function resize() {
      // 결과 목록을 키운 만큼 프레임도 여유 있게
      const h = Math.min(Math.max(document.body.scrollHeight + 8, 360), 520);
      setFrameHeight(h);
    }

    function scrollUp() {
      try {
        // 결과 제목으로 스크롤하면 입력칸이 위로 사라짐 → 입력칸을 기준으로 고정
        const anchor = document.querySelector('label[for="q"]') || qInput;
        const side =
          window.parent && window.parent.document
            ? window.parent.document.querySelector('[data-testid="stSidebar"]')
            : null;

        if (side && anchor) {
          // 사이드바 안에서 입력 라벨이 보이도록 위치 맞춤
          const sideRect = side.getBoundingClientRect();
          const aRect = anchor.getBoundingClientRect();
          const delta = aRect.top - sideRect.top - 8;
          if (delta < 0 || delta > 80) {
            side.scrollTop = Math.max(0, side.scrollTop + delta);
          }
        }

        // 입력칸이 화면 상단에 보이도록 (결과는 그 아래 스크롤 영역)
        if (anchor && anchor.scrollIntoView) {
          anchor.scrollIntoView({ block: "start", behavior: "smooth", inline: "nearest" });
        }
        if (qInput && qInput.focus) {
          // 포커스는 유지하되 강제 점프는 하지 않음
        }
      } catch (e) {}
      resize();
    }

    function emit(payload) {
      const key = JSON.stringify(payload);
      if (key === lastSent) return;
      lastSent = key;
      setComponentValue(payload);
    }

    function renderResults() {
      const query = qInput.value;
      const hits = filter(query);
      resultsEl.innerHTML = "";

      if (!norm(query)) {
        resultsEl.innerHTML = '<div class="empty"></div>';
        pickedEl.textContent = "";
        selected = null;
        resize();
        return;
      }

      if (!hits.length) {
        resultsEl.innerHTML =
          '<div class="empty">시작 일치 종목이 없습니다.</div>';
        pickedEl.textContent = "";
        const fallback = norm(query).match(/^[0-9]{6}$/)
          ? query.trim() + ".KS"
          : query.trim().toUpperCase();
        emit({ query: query, ticker: null, label: null, fallback: fallback, fromList: false });
        scrollUp();
        return;
      }

      hits.forEach(function (item) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className =
          "item" + (selected && selected.ticker === item.ticker ? " selected" : "");
        btn.textContent = item.name + " (" + item.ticker + ")";
        btn.addEventListener("click", function () {
          selected = item;
          pickedEl.textContent = "선택됨: " + item.name + " (" + item.ticker + ")";
          emit({
            query: query,
            ticker: item.ticker,
            label: item.name + " (" + item.ticker + ")",
            fromList: true,
          });
          renderResults();
        });
        resultsEl.appendChild(btn);
      });

      if (!selected || !startsWithHit(selected, query)) {
        selected = null;
        pickedEl.textContent = "아래에서 종목을 선택해 터치하세요.";
        emit({ query: query, ticker: null, label: null, fromList: false });
      }

      scrollUp();
    }

    function onStreamlitRender(event) {
      if (!event.data || event.data.type !== "streamlit:render") return;
      const args = event.data.args || {};
      catalog = args.catalog || [];
      if (typeof args.default_query === "string" && !qInput.dataset.filled) {
        qInput.value = args.default_query;
        qInput.dataset.filled = "1";
      }
      if (args.default_ticker && !selected) {
        const found = catalog.find(function (c) {
          return c.ticker === args.default_ticker;
        });
        if (found) {
          selected = found;
          pickedEl.textContent =
            "선택됨: " + found.name + " (" + found.ticker + ")";
        }
      }
      renderResults();
      resize();
    }

    window.addEventListener("message", onStreamlitRender);
    qInput.addEventListener("compositionend", renderResults);
    qInput.addEventListener("input", renderResults);
    qInput.addEventListener("focus", function () {
      setTimeout(scrollUp, 280);
    });

    /* ---------- 음성 입력 (Web Speech API) ---------- */
    const micBtn = document.getElementById("mic");
    const voiceStatus = document.getElementById("voice-status");
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let listening = false;

    function setVoiceStatus(msg) {
      voiceStatus.textContent = msg || "";
      resize();
    }

    function stopListening() {
      listening = false;
      micBtn.classList.remove("listening");
      micBtn.textContent = "🎤";
      try {
        if (recognition) recognition.stop();
      } catch (e) {}
    }

    function startListening() {
      if (!SpeechRec) {
        setVoiceStatus("이 브라우저는 음성 인식을 지원하지 않습니다. 텍스트로 입력해 주세요.");
        return;
      }
      if (listening) {
        stopListening();
        setVoiceStatus("");
        return;
      }

      recognition = new SpeechRec();
      recognition.lang = "ko-KR";
      recognition.interimResults = true;
      recognition.continuous = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = function () {
        listening = true;
        micBtn.classList.add("listening");
        micBtn.textContent = "⏹";
        setVoiceStatus("듣는 중… 종목 이름을 말해 주세요.");
      };

      recognition.onerror = function (ev) {
        stopListening();
        const err = (ev && ev.error) || "";
        if (err === "not-allowed" || err === "service-not-allowed") {
          setVoiceStatus("마이크 권한이 필요합니다. 브라우저 설정에서 허용해 주세요.");
        } else if (err === "no-speech") {
          setVoiceStatus("음성이 감지되지 않았습니다. 다시 눌러 주세요.");
        } else if (err === "aborted") {
          setVoiceStatus("");
        } else {
          setVoiceStatus("음성 인식에 실패했습니다. 다시 시도해 주세요.");
        }
      };

      recognition.onend = function () {
        stopListening();
        if (voiceStatus.textContent.indexOf("듣는 중") === 0) {
          setVoiceStatus("");
        }
      };

      recognition.onresult = function (ev) {
        let finalText = "";
        let interim = "";
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const t = ev.results[i][0].transcript || "";
          if (ev.results[i].isFinal) finalText += t;
          else interim += t;
        }
        const text = (finalText || interim || "").trim();
        if (!text) return;

        // 공백·조사 정도만 가볍게 정리
        const cleaned = text.replace(/\s+/g, "").replace(/(으)?로$|(을|를)$/g, "");
        qInput.value = cleaned || text;
        renderResults();
        scrollUp();

        if (finalText) {
          setVoiceStatus("인식됨: " + qInput.value);
          stopListening();
        } else {
          setVoiceStatus("듣는 중… " + text);
        }
      };

      try {
        recognition.start();
      } catch (e) {
        stopListening();
        setVoiceStatus("음성 인식을 시작할 수 없습니다.");
      }
    }

    micBtn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      startListening();
    });

    setReady();
    setFrameHeight(400);
  </script>
</body>
</html>
